{% extends "base.html" %}
{% set name = "settings" %}

{% block content %}
<h1>Change Local Council</h1>
<form method="POST">
    <div class="form-group">
        <label for="current_council">Current Council:</label>
        <input type="text" class="form-control" id="current_council" name="current_council" required>
    </div>
    <div class="form-group">
        <label for="new_council">New Council:</label>
        <input type="text" class="form-control" id="new_council" name="new_council" required>
    </div>
    <button type="submit" class="btn btn-primary">Change Council</button>
    <a href="{{ url_for('settings') }}" class="btn btn-secondary">Cancel</a>
</form>
{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}
{% endblock %}
