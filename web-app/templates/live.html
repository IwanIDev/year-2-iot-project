{% extends "base.html" %}
{% set name = "live" %}

{% block content %}
    <head>
        <style>
            .calendar {
                display: flex;
                gap: 20px;
                padding: 20px;
            }

            .day, .today {
                background: white;
                border-radius: 12px;
                padding: 20px;
                width: 25%;
                text-align: center;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            .today{
                background: #107AB0;
            }

            .day-name{
                font-weight: bold;
            }
        </style>
    </head>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <body>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <div class="fact">
            <p>{{ fact }}</p>
        </div>
        <div class="split"></div>
        <div class="bin-dates">
           <h3>Your next collection date:</h3>
           <h1>{{date.value}}</h1>
           <h3>Bins Taken</h3>
           <h3>{{bins.value}}</h3>
        </div>
        <!-- Last updated timestamp (updated from js script) right aligned -->
        <div id="last_updated" style="text-align: right; padding: 10px;">
          <p>
              <span class="glyphicon glyphicon-time"></span>
              <span id="timestamp">Last updated: ...</span>
          </p>
        </div>
        <div class="split"></div>
        <div>
            <h1 id="recent">...</h1>
            <p>most recent item</p>
        </div>
        <div>
            <h1 id="today_count">...</h1> <!-- Use This number to update points in leaderboard-->
            <p>items scanned today</p>
        </div>
        <br>
        <div class="split"></div>
        <div id="hourlyAverage"></div>

        <script src="{{ url_for('static', filename='js/live.js') }}"></script>
    </body>
{% endblock %}
