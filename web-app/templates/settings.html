{% extends "base.html" %}
{% set name = "settings" %}

{% block content %}
<h1>Settings</h1>
<h2>Profile Settings</h2>
<table style="width: 100%; max-width: 500px; border-collapse: collapse;">
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; width: 40%;">Username:</td>
        <td style="padding: 10px;">{{ user.username }}</td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; width: 40%;">Password:</td>
        <td style="padding: 10px;">
            <button onclick="window.location.href='{{ url_for('change_password') }}'">Change Password</button>
        </td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; width: 40%;">Device ID:</td>
        <td style="padding: 10px;">{{ user.device_id }}</td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; width: 40%;">Local Council:</td>
        <td style="padding: 10px;">{{ council.name }}</td>
        <td style="padding: 10px;">
            <button onclick="window.location.href='{{ url_for('change_council') }}'">Change Local Council</button>
        </td>
    </tr>
</table>
<p style="margin-top: 20px;"><a href="{{ url_for('logout') }}">Log out</a></p>

{% endblock %}
