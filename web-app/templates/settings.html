{% extends "base.html" %}

{% block content %}
<h1>Settings</h1>
<h2>Profile Settings</h2>
<table style="width: 100%; max-width: 500px; border-collapse: collapse;">
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; width: 40%;">Username:</td>
        <td style="padding: 10px;">{{ user.username }}</td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; width: 40%;">Password:</td>
        <td style="padding: 10px;">
            <span id="passwordDisplay">••••••••</span> <!-- Didnt realise password was hashed will have to change this to just a change password button-->
            <button onclick="togglePassword()" style="margin-left: 10px; padding: 5px 10px;">Show</button>
        </td>
    </tr>
</table>
<p style="margin-top: 20px;"><a href="{{ url_for('logout') }}">Log out</a></p>

<script>
    let isPasswordVisible = false;
    const actualPassword = '{{ password }}';
    
    function togglePassword() {
        const passwordDisplay = document.getElementById('passwordDisplay');
        const button = event.target;
        
        isPasswordVisible = !isPasswordVisible;
        
        if (isPasswordVisible) {
            passwordDisplay.textContent = actualPassword;
            button.textContent = 'Hide';
        } else {
            passwordDisplay.textContent = '••••••••';
            button.textContent = 'Show';
        }
    }
</script>
{% endblock %}
