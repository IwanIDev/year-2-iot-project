{% extends "base.html" %}
{% set name = "home" %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        h1{
            max-width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .form_group{
            display: table;
            width: 100%;
        }

        .form_element{
            display: table-row;
        }

        label,
        input,
        select{
            width: 50%;
            display: table-cell;
            margin: 3px;
        }

        label{
            text-align: right;
        }

        input,
        select{
            margin-right: 100%;
            border-radius: 10px;
            padding: 6px 10px;
            box-sizing: border-box;
        }

        button{
            display: flex;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <div>
        <h1>Log in</h1>
        <form action="login" method="post">
            <div class="form_group">
                <p class="form_element">
                    <label for="username">Username</label>
                    <input type="text" name="username" required />
                </p>
                <p class="form_element">
                    <label for="password">Password</label>
                    <input type="password" name="password" required />
                </p>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
    <div>
        <h1>Sign Up</h1>
        <form action="register" method="post">
            <div class="form_group">
                <p class="form_element">
                    <label for="username">Username</label>
                    <input type="text" name="username" required />
                </p>
                <p class="form_element">
                    <label for="password">Password</label>
                    <input type="password" name="password" required />
                </p>
                <p class="form_element">
                    <label for="device_id">Device ID</label>
                    <input type="text" name="device_id" required value="{{ id }}" />
                </p>
                <p class="form_element">
                    <label for="local_council">Select your council:</label>
                    <select id="local_council" name="local_council" required>
                        <option value="" selected disabled>Select your council</option>
                        <option value="Blaenau Gwent">Blaenau Gwent</option>
                        <option value="Bridgend">Bridgend</option>
                        <option value="Caerphilly">Caerphilly</option>
                        <option value="Cardiff">Cardiff</option>
                        <option value="Carmarthenshire">Carmarthenshire</option>
                        <option value="Ceredigion">Ceredigion</option>
                        <option value="Conwy">Conwy</option>
                        <option value="Denbighshire">Denbighshire</option>
                        <option value="Flintshire">Flintshire</option>
                        <option value="Gwynedd">Gwynedd</option>
                        <option value="Isle of Anglesey">Isle of Anglesey</option>
                        <option value="Merthyr Tydfil">Merthyr Tydfil</option>
                        <option value="Monmouthshire">Monmouthshire</option>
                        <option value="Neath Port Talbot">Neath Port Talbot</option>
                        <option value="Newport">Newport</option>
                        <option value="Pembrokeshire">Pembrokeshire</option>
                        <option value="Powys">Powys</option>
                        <option value="Rhondda Cynon Taf">Rhondda Cynon Taf</option>
                        <option value="Swansea">Swansea</option>
                        <option value="Torfaen">Torfaen</option>
                        <option value="Vale of Glamorgan">Vale of Glamorgan</option>
                        <option value="Wrexham">Wrexham</option>
                    </select>
                </p>
            </div>
            <button type="submit">Sign Up</button>
        </form>
</body>
</html>
{% endblock %}
