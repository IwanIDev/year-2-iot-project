{% extends "base.html" %}
{% set name = "home" %}
{% set title = "Home" %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        h1{
            max-width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .form_group{
            display: table;
            width: 100%;
        }

        .form_element{
            display: table-row;
        }

        label,
        input,
        select{
            width: 50%;
            display: table-cell;
            margin: 3px;
        }

        label{
            text-align: right;
        }

        input,
        select{
            margin-right: 100%;
            border-radius: 10px;
            padding: 6px 10px;
            box-sizing: border-box;
        }

        .hint {
            display: block;
            font-size: 0.9rem;
            margin-top: 4px;
            margin-left: 0;
        }

        .hint a {
            margin-left: 4px;
        }

        button{
            display: flex;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <div>
        <h1>Log in</h1>
        <form action="login" method="post">
            <div class="form_group">
                <p class="form_element">
                    <label for="username">Username</label>
                    <input type="text" name="username" required />
                </p>
                <p class="form_element">
                    <label for="password">Password</label>
                    <input type="password" name="password" required />
                </p>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
    <div>
        <h1>Sign Up</h1>
        <form action="register" method="post">
            <div class="form_group">
                <p class="form_element">
                    <label for="username">Username</label>
                    <input type="text" name="username" required />
                </p>
                <p class="form_element">
                    <label for="email">Email</label>
                    <input type="email" name="email" required />
                </p>
                <p class="form_element">
                    <label for="password">Password</label>
                    <input type="password" name="password" required />
                </p>
                <p class="form_element">
                    <label for="device_id">Device ID</label>
                    <input type="text" name="device_id" required value="{{ id }}" />
                </p>
                <p class="form_element">
                    
                    <label for="council">Select your council:</label>

                    <select id="councils" name="council">
                    <option value="1">Blaenau Gwent</option>
                    <option value="2">Bridgend</option>
                    <option value="3">Caerphilly</option>
                    <option value="4">Cardiff</option>
                    <option value="5">Carmarthenshire</option>
                    <option value="6">Ceredigion</option>
                    <option value="7">Conwy</option>
                    <option value="8">Denbighshire</option>
                    <option value="9">Flintshire</option>
                    <option value="10">Gwynedd</option>
                    <option value="11">Isle of Anglesey</option>
                    <option value="12">Merthyr Tydfil</option>
                    <option value="13">Monmouthshire</option>
                    <option value="14">Neath Port Talbot</option>
                    <option value="15">Newport</option>
                    <option value="16">Pembrokeshire</option>
                    <option value="17">Powys</option>
                    <option value="18">Rhondda Cynon Taf</option>
                    <option value="19">Swansea</option>
                    <option value="20">Torfaen</option>
                    <option value="21">Vale of Glamorgan</option>
                    <option value="22">Wrexham</option>
                    </select>
                </p>

                <p class="form_element">
                    <label for="UPRN">Unique Property Reference Number <b>(UPRN)</b></label>
                    <input type="text" name="UPRN" required />
                    <span class="hint">Find your UPRN<a href="https://www.findmyaddress.co.uk" target="_blank" rel="noopener noreferrer">here</a></span>
                </p>
            </div>
            <button type="submit">Sign Up</button>
        </form>
</body>
</html>
{% endblock %}
