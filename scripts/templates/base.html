{% extends "bootstrap/base.html" %}

{% block navbar %}
<html>
    <head>
        <style>
            body{
                float: left;
                margin-left: 5%;
                width: 90%;
            }

            .gridcontainer{
                display: grid;
                width: 100%;
                grid-template-columns: repeat(3,1fr)
            }

            .col{ 
                border-radius: 5%;
                padding: 2%;
                margin: 2%;
                border-color: #107AB0;
                border-style: solid;
            }

            td{
                padding: 5px;
            }

            .navbar{
                background-color: #107AB0;
            }

            img{
                border-radius: 5%;
                border-color: black;
                border-style: solid;
                border-width: 2px;
            }

            .navi{
                background-color: #107AB0;
                align-content: center;
                width: 100%;
                height: 70px;
            }

            .title{
                font-size: xx-large;
                text-align: center;
                margin-top: 10px;
            }

            .page{
                font-size: large;
                color: black;
            }

            a{
                color: #107AB0;
            }

            div {
                text-align: center; 
            }
        </style>
    </head>
</html>
<div>
        <table class="navi">
            <tr>
                <td>
                    <p class="title">Bin Buddy 
                    <br>
                    <a class="page" href="{{ url_for('live_view') }}">Live View</a> |
                    <a class="page" href="{{ url_for('dashboard') }}">Dashboard</a> |
                    <a class="page" href="{{ url_for('leaderboard') }}">Leaderboard</a> |
                    <a class="page" href="{{ url_for('profile') }}">Profile</a>
                    </p>
                </td>
            </tr>
        </table>
        <br>
</div>
{% endblock %}
